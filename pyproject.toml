[project]
name = "mailroom-live"
version = "0.1.0"
description = "Mailroom: a learning project for Programming Fundamentals (Agent Factory, Chapter 13)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

# `uv run mailroom ...` runs main() in src/mailroom/commands.py
[project.scripts]
mailroom = "mailroom.commands:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

# The package is called mailroom (src/mailroom), not mailroom_live
[tool.uv.build-backend]
module-name = "mailroom"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
